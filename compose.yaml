services:
  openai-oauth:
    build: .
    image: ar0per0/openai-oauth:latest
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      # Cambiar a "browser" para iniciar sesión mediante el navegador.
      LOGIN_MODE: device
      PORT: 10531
      TZ: Europe/Madrid
      # Modelo usado por las pruebas cron y de inicio; vacío usa el primero de /v1/models.
      MODEL_TEST: ""
      # Varios horarios se separan con: 5 4 * * * | 2 4 * * *
      CRON_TEST: ""
      # Número total de respuestas OK consecutivas exigidas en cada ejecución.
      CRON_TEST_COUNT: 3
      # Ejecuta las mismas pruebas al arrancar si auth.json ya existía.
      STARTUP_MODEL_TEST: true
      # Tiempo máximo de cada petición de prueba, tanto cron como de inicio.
      HEALTHCHECK_TIMEOUT_MS: 30000
    volumes:
      - openai-oauth-data:/data/codex

volumes:
  openai-oauth-data:
